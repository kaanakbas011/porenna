<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Porenna | Every Story Deserves a Place</title>

    <meta name="description"
        content="Kişiye özel hikâyeleri zamansız porselen tasarımlarına dönüştüren sanat markası.">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ========================================= -->
<!-- HERO -->
<!-- ========================================= -->

<section class="hero">

    <div class="hero-content">

        <h1 class="logo">

            PORENNA

        </h1>

        <h2>

            Her hikâye bir iz bırakır.

        </h2>

        <p>

            Bazıları porselende yaşamaya devam eder.

        </p>

    </div>

    <div class="scroll-indicator">

        <span>Kaydır</span>

        <div class="arrow">

            ↓

        </div>

    </div>

</section>

<!-- ========================================= -->
<!-- PLATE SECTION -->
<!-- ========================================= -->

<section class="plate-section">

    <div class="plate-wrapper">

        <img
            src="images/plate-01.png"
            class="plate plate01"
            alt="Porenna Plate">

        <img
            src="images/plate-02.png"
            class="plate plate02"
            alt="Porenna Plate">

        <img
            src="images/plate-03.png"
            class="plate plate03"
            alt="Porenna Plate">

        <img
            src="images/plate-04.png"
            class="plate plate04"
            alt="Porenna Plate">

    </div>

</section>

<!-- GSAP -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<script src="app.js"></script>

</body>
</html>
